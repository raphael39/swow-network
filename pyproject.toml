[project]
name = "swow-network"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "en-core-web-sm",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "nl-core-news-lg",
    "nl-core-news-sm",
    "polars>=2.1.0",
    "pymovements>=0.28.0",
    "spacy>=3.8.18",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
nl-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl" }
nl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl" }
